name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a build can be kicked off by hand without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run of the same branch pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uv-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Test reports are worth far more than the log when something fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
