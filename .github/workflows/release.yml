name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Needed to create the release and attach the APK to it.
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Catching a forgotten version bump here is far cheaper than shipping a v1.2.0 tag
      # containing an APK that calls itself 1.1.0.
      - name: Check the tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release"
            exit 1
          fi
          # Outside the workspace so it cannot be picked up as a build input or archived.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Confirm the APK really is signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/uv-widget-${GITHUB_REF_NAME}.apk"

      # A tag can arrive two ways: pushed from the command line, or created by the web UI, which
      # makes the tag and the release in one go. Attach to an existing release rather than
      # failing on it, so either route ends with the APK on the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/uv-widget-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — attaching the APK to it"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "$asset"
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
